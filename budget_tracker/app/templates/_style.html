<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17222C;
    --ink-soft:#5C6B76;
    --ink-faint:#8A97A0;
    --board:#E6EAE8;
    --surface:#FFFFFF;
    --surface-2:#F6F8F7;
    --line:#E2E7E4;
    --line-strong:#D2D9D5;
    --accent:#0F7C67;
    --accent-ink:#0A5A4B;
    --t-kredit:#3D5A8A;
    --t-renov:#B9822F;
    --t-urlaub:#1B9E77;
    --t-sonder:#6B7A85;
    --received:#1B9E77;
    --warn:#B4462A;
    --radius:18px;
    --font-display:"Space Grotesk", system-ui, sans-serif;
    --font-body:"Inter", system-ui, -apple-system, sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--font-body);
    background:var(--board);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:88px;
  }
  a{color:inherit;text-decoration:none;}

  .board{max-width:640px;margin:0 auto;}

  .appbar{background:var(--surface);padding:10px 18px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .appbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .appbar .ha-ctx{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .appbar .ha-ctx svg{width:11px;height:11px;}
  .appbar h2{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;}
  .icon-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .icon-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
  .icon-btn svg{width:18px;height:18px;}

  main.body{padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .card-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin-bottom:10px;}

  .hero{background:var(--ink);color:#fff;border:none;position:relative;overflow:hidden;}
  .hero .card-label{color:rgba(255,255,255,.55);}
  .hero .total{font-family:var(--font-mono);font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1;}
  .hero .total .cur{font-size:19px;color:rgba(255,255,255,.55);margin-left:4px;}
  .hero .sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:6px;}

  .topf-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;gap:10px;}
  .topf-row + .topf-row{border-top:1px solid var(--line);}
  .topf-row.warn{border:1.5px solid var(--warn);border-top:1.5px solid var(--warn) !important;border-radius:12px;padding:10px 11px;margin:2px 0;background:rgba(180,70,42,.05);}
  .topf-row.warn + .topf-row{border-top:1px solid var(--line);}
  .topf-row .who{display:flex;align-items:center;gap:10px;min-width:0;}
  .tdot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .tdot.kredit{background:var(--t-kredit);}
  .tdot.renov{background:var(--t-renov);}
  .tdot.urlaub{background:var(--t-urlaub);}
  .tdot.sonder{background:var(--t-sonder);}
  .tdot.warn{background:var(--warn);}
  .tdot.faint{background:var(--ink-faint);}
  .topf-row .nm{font-size:14px;font-weight:500;}
  .topf-row .goal{font-size:10.5px;color:var(--ink-faint);margin-top:1px;}
  .topf-row .amt{font-family:var(--font-mono);font-size:15px;font-weight:600;text-align:right;flex-shrink:0;}
  .topf-row .todo-amt{font-size:13px;flex-shrink:0;}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap;}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .chip.kredit{color:var(--t-kredit);background:rgba(61,90,138,.12);}
  .chip.renov{color:var(--t-renov);background:rgba(185,130,47,.13);}
  .chip.urlaub{color:var(--t-urlaub);background:rgba(27,158,119,.13);}
  .chip.sonder{color:var(--t-sonder);background:rgba(107,122,133,.12);}
  .chip.offen{color:var(--warn);background:rgba(180,70,42,.1);}
  .chip.ok{color:var(--received);background:rgba(27,158,119,.1);}

  .buchung{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:9px;}
  .buchung.unresolved{border-color:rgba(180,70,42,.35);background:rgba(180,70,42,.04);}
  .buchung.past{opacity:.92;}
  .buchung .b-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .buchung .b-desc{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:-.005em;line-height:1.25;}
  .buchung .b-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;font-family:var(--font-mono);}
  .buchung .b-amt{font-family:var(--font-mono);font-size:15px;font-weight:600;text-align:right;flex-shrink:0;}
  .buchung .b-amt.neg{color:var(--ink);}
  .buchung .b-amt.pos{color:var(--received);}
  .buchung .b-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;flex-wrap:wrap;}
  .b-ref{font-size:11px;color:var(--ink-faint);font-style:italic;}

  .filters{display:flex;gap:7px;overflow-x:auto;flex-shrink:0;padding-bottom:2px;}
  .fchip{font-size:12px;font-weight:500;padding:6px 12px;border-radius:20px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);white-space:nowrap;}
  .fchip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .fchip.warn-chip{border-color:var(--warn);color:var(--warn);}

  .assign-row{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;}
  .assign-btn{flex:1;min-width:112px;text-align:center;font-size:11.5px;font-weight:600;padding:9px 6px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft);overflow-wrap:break-word;hyphens:auto;}
  .assign-btn.kredit{border-color:var(--t-kredit);color:var(--t-kredit);}
  .assign-btn.renov{border-color:var(--t-renov);color:var(--t-renov);}
  .assign-btn.urlaub{border-color:var(--t-urlaub);color:var(--t-urlaub);}
  .assign-btn.sonder{border-color:var(--t-sonder);color:var(--t-sonder);}

  .sec-t{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin:2px 2px -2px;}

  .pair{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:9px;}
  .pair .p-side{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
  .pair .p-side .lbl{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;}
  .pair .p-side .val{font-size:13px;font-weight:500;font-family:var(--font-mono);}
  .pair .p-mid{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--ink-faint);font-size:11px;}
  .pair .p-mid svg{width:14px;height:14px;flex-shrink:0;}
  .pair-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .btn-outline{flex:1;text-align:center;font-size:12px;font-weight:600;padding:9px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft);cursor:pointer;min-width:120px;}
  .btn-outline.accent{border-color:var(--accent);color:var(--accent);background:rgba(15,124,103,.06);}

  .forecast-item{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:9px;}
  .forecast-item.future{border-style:dashed;border-color:var(--line-strong);background:var(--surface-2);}
  .forecast-item .f-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .forecast-item .f-name{font-family:var(--font-display);font-size:14px;font-weight:600;}
  .forecast-item .f-date{font-size:11.5px;color:var(--ink-soft);margin-top:2px;font-family:var(--font-mono);}
  .forecast-item .f-amt{font-family:var(--font-mono);font-size:15px;font-weight:600;text-align:right;flex-shrink:0;}
  .forecast-item .f-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px;}
  .link-btn,.push-btn,.credit-btn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border:none;background:none;cursor:pointer;font-family:var(--font-body);padding:0;}
  .link-btn{color:var(--accent);}
  .push-btn{color:var(--ink-faint);font-weight:500;}
  .credit-btn{color:var(--t-sonder);}
  .link-btn svg,.push-btn svg,.credit-btn svg{width:13px;height:13px;}
  .f-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;}

  .stand-card{padding:12px 0;}
  .stand-card .sc-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .stand-card .sc-amt{font-family:var(--font-mono);font-size:24px;font-weight:600;}
  .sc-spark{display:block;width:100%;height:auto;margin-top:4px;}
  .sc-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);margin-top:9px;}
  .sc-status svg{width:13px;height:13px;flex-shrink:0;}
  .sc-status.ok{color:var(--received);}
  .sc-status.bad{color:var(--warn);}

  .dir-tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;font-weight:600;background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--line);}
  .dir-tag.in{color:var(--received);}
  .dir-tag.out{color:var(--warn);}

  .cta-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:14px;padding:13px;font-size:13px;font-weight:600;color:var(--accent);}
  .cta-btn svg{width:16px;height:16px;}

  .topf-filter{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap;}
  .tf-btn{flex:1;min-width:100px;text-align:center;font-size:12px;font-weight:600;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);overflow-wrap:break-word;hyphens:auto;}
  .tf-btn.on.kredit{background:rgba(61,90,138,.12);border-color:var(--t-kredit);color:var(--t-kredit);}
  .tf-btn.on.renov{background:rgba(185,130,47,.13);border-color:var(--t-renov);color:var(--t-renov);}
  .tf-btn.on.urlaub{background:rgba(27,158,119,.13);border-color:var(--t-urlaub);color:var(--t-urlaub);}
  .tf-btn.on.sonder{background:rgba(107,122,133,.12);border-color:var(--t-sonder);color:var(--t-sonder);}

  .month-divider{display:flex;align-items:center;gap:8px;margin:10px 2px 2px;}
  .month-divider .md-line{flex:1;height:1px;background:var(--line-strong);}
  .month-divider .md-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;}
  .month-divider.now .md-label{color:var(--accent);font-weight:600;}
  .month-divider.now .md-line{background:var(--accent);opacity:.35;}

  .progress-bar{background:var(--line);border-radius:999px;height:8px;overflow:hidden;margin:6px 0;}
  .progress-bar > div{background:var(--accent);height:100%;}

  form.inline{display:inline;}
  button{font:inherit;}

  .form-grid{display:grid;gap:12px;}
  .form-grid label{display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;min-width:0;}
  input,select,textarea{
    font-family:var(--font-body);
    font-size:14.5px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    min-width:0;
    max-width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--accent);color:#fff;border:none;
    padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:var(--font-body);
    width:100%;
  }
  .btn svg{width:16px;height:16px;flex-shrink:0;}
  .btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);}

  .fehler{background:rgba(180,70,42,.09);color:var(--warn);border:1px solid rgba(180,70,42,.25);padding:11px 14px;border-radius:12px;font-size:13.5px;}
  .hinweis{background:rgba(15,124,103,.08);color:var(--accent-ink);border:1px solid rgba(15,124,103,.25);padding:11px 14px;border-radius:12px;font-size:13.5px;}

  details > summary{cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;list-style:none;}
  details > summary::-webkit-details-marker{display:none;}
  details[open] > summary{margin-bottom:10px;}

  .empty-state{font-size:13.5px;color:var(--ink-soft);padding:8px 2px;}

  .meta-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;}
  .meta-row:first-child{border-top:none;}
  .meta-row .k{color:var(--ink-faint);font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;}
  .meta-row .v{text-align:right;word-break:break-word;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .back-link svg{width:15px;height:15px;}

  .tabbar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));
    max-width:640px;margin:0 auto;z-index:20;
  }
  .tab-wrap{position:relative;display:flex;flex:1;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-faint);padding:2px 0;}
  .tab svg{width:21px;height:21px;}
  .tab .lbl{font-size:10px;font-weight:500;}
  .tab.on{color:var(--accent);}
  .badge-count{position:absolute;top:-2px;right:14%;background:var(--warn);color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

  table.data-table{width:100%;border-collapse:collapse;}
  thead th{font-size:10.5px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-strong);}
  thead th.num,tbody td.num{text-align:right;}
  tbody td{padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  td.desc{font-weight:600;font-family:var(--font-display);}
  td.num{font-family:var(--font-mono);}
  td.num.pos{color:var(--received);}

  .desk-only{display:none;}

  @media (min-width:760px){
    .board{max-width:960px;}
    .desk-only{display:block;}
    .mobile-only{display:none;}
    .tabbar{position:static;max-width:none;border-top:none;border-bottom:1px solid var(--line);justify-content:center;gap:40px;padding:10px 6px;}
    .tab-wrap{flex:none;width:88px;}
    body{padding-bottom:0;}
    main.body{padding:20px 24px 32px;}
    .appbar{padding:14px 24px;}
  }
</style>
