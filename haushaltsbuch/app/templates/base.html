<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Haushaltsbuch{% endblock %}</title>
  <link rel="stylesheet" href="{{ base }}/static/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Haushaltsbuch</h1>
  </header>

  <nav class="bottom-nav">
    <a href="{{ base }}/" class="{{ 'active' if request.url.path == '/' else '' }}">
      <span class="icon">&#8962;</span>Übersicht
    </a>
    <a href="{{ base }}/buchungen" class="{{ 'active' if request.url.path.startswith('/buchungen') else '' }}">
      <span class="icon">&#8801;</span>Buchungen
    </a>
    <a href="{{ base }}/zuordnen" class="{{ 'active' if request.url.path.startswith('/zuordnen') else '' }}">
      <span class="icon">&#10003;</span>Zuordnen
    </a>
    <a href="{{ base }}/umbuchungen" class="{{ 'active' if request.url.path.startswith('/umbuchungen') else '' }}">
      <span class="icon">&#8646;</span>Umbuchungen
    </a>
    <a href="{{ base }}/forecast" class="{{ 'active' if request.url.path.startswith('/forecast') else '' }}">
      <span class="icon">&#128200;</span>Forecast
    </a>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    {% block footer %}{% endblock %}
  </footer>
</body>
</html>
